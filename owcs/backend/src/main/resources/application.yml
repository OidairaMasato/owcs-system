server:
  # Render は起動時に PORT 環境変数でポートを指定してくる。ローカルは 8081。
  port: ${PORT:8081}

spring:
  datasource:
    # 本番（Neon）は SPRING_DATASOURCE_URL / USERNAME / PASSWORD を環境変数で渡す。
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/owcs}
    username: ${SPRING_DATASOURCE_USERNAME:owcs}
    password: ${SPRING_DATASOURCE_PASSWORD:owcs}
    hikari:
      # 無料枠は同時接続数が少ないので絞る
      maximum-pool-size: ${DB_POOL_SIZE:3}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

owcs:
  pandascore:
    base-url: https://api.pandascore.co
    # 環境変数 PANDASCORE_TOKEN から読む。値をここに書かないこと。
    token: ${PANDASCORE_TOKEN:}
  # 追う対象。Phase 2 でカンマ区切りに増やす
  team-ids: ${OWCS_TEAM_IDS:135271}
  league-id: 5223
  sync:
    # 常時起動しているときの定期取り込み
    results-cron: ${SYNC_RESULTS_CRON:0 */10 * * * *}
    schedule-cron: ${SYNC_SCHEDULE_CRON:0 5/30 * * * *}
    # 無料枠ではアプリがスリープして定期実行が止まるため、
    # ダッシュボード要求時にこの時間より古ければその場で取り込む。
    max-age: ${SYNC_MAX_AGE:PT10M}
    # 失敗が続いたときに叩き続けないための最短間隔
    retry-interval: ${SYNC_RETRY_INTERVAL:PT1M}

logging:
  level:
    jp.oidaira.owcs: INFO
