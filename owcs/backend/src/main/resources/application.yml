server:
  # Render は起動時に PORT 環境変数でポートを指定してくる。ローカルは 8081。
  port: ${PORT:8081}

spring:
  datasource:
    # 本番（Neon）は SPRING_DATASOURCE_URL / USERNAME / PASSWORD を環境変数で渡す。
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/owcs}
    username: ${SPRING_DATASOURCE_USERNAME:owcs}
    password: ${SPRING_DATASOURCE_PASSWORD:owcs}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:3}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

owcs:
  pandascore:
    base-url: https://api.pandascore.co
    # 環境変数 PANDASCORE_TOKEN から読む。値をここに書かないこと。
    token: ${PANDASCORE_TOKEN:}
  # OWCS のリーグ id。PandaScore 上の名前は "OCS"。
  league-id: ${OWCS_LEAGUE_ID:5223}

  # 追う大会（シリーズ）の範囲。地域では絞らない。
  # 地域名で絞ると Midseason Championship や World Finals のような
  # 国際大会が名前に地域を含まないため丸ごと漏れる。期間で絞る。
  series:
    # 終わった大会をどこまで遡って残すか。
    # シーズン全体（Stage 1 から）を見返せるよう、1 シーズン分を確保する。
    # 終わった大会は初回に一度取り込むだけなので、広げても継続コストは増えない。
    past-days: ${OWCS_SERIES_PAST_DAYS:280}
    # これから始まる大会をどこまで先取りするか
    future-days: ${OWCS_SERIES_FUTURE_DAYS:120}
    # 取り込み対象の上限。無料枠を守るための保険
    max: ${OWCS_SERIES_MAX:24}
    # この日数だけ前後に広げた期間に「いま」が入る大会は毎回同期する。
    # それ以外は初回だけ取り込み、以後は放置する（結果が変わらないため）。
    hot-margin-days: ${OWCS_SERIES_HOT_MARGIN_DAYS:7}
  sync:
    results-cron: ${SYNC_RESULTS_CRON:0 */10 * * * *}
    schedule-cron: ${SYNC_SCHEDULE_CRON:0 5/30 * * * *}
    # 無料枠ではアプリがスリープして定期実行が止まるため、
    # 画面が要求された時点でこの時間より古ければその場で取り込む。
    max-age: ${SYNC_MAX_AGE:PT10M}
    retry-interval: ${SYNC_RETRY_INTERVAL:PT1M}
    # 試合中はスコアが数分で変わるので、この短い間隔で取り込み直す。
    # 対象は試合結果だけで、順位表とロゴまでは毎分叩かない。
    live-max-age: ${SYNC_LIVE_MAX_AGE:PT1M}

logging:
  level:
    jp.oidaira.owcs: INFO
